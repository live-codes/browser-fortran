<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortran runner harness</title>
<style>body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 1rem; }
pre { white-space: pre-wrap; }</style>
</head>
<body>
<p id="status">starting…</p>
<pre id="log"></pre>

<!--
  An isolated harness for lang-fortran-wasm-script.js, the LiveCodes result-page runner.

  It reproduces what the result page provides: a `window.livecodes` object, a program script carrying
  both the compiler's type and the `data-livecodes-script="editor"` marker the result page sets, and
  the built runner loaded as a classic script.

  The runner reads the program from that script tag, not from `run()`'s argument (which is stdin), so
  each case below rewrites the tag — the same thing the result page does between runs.

  The runner is copied here from build/livecodes/ (same origin — a cross-origin classic script is
  blocked by Chrome's opaque response blocking, which looks exactly like a runner that never runs).
  The worker inside it loads the compiler from its published CDN URL, which is the real path.
-->
<script>
	window.livecodes = {};
	const log = (message) => {
		document.getElementById('log').textContent += `${message}\n`;
	};
</script>

<script type="text/fortran-wasm" data-livecodes-script="editor">print *, 'placeholder'
</script>

<script src="./lang-fortran-wasm-script.js"></script>

<script>
	const started = Date.now();
	const CASES = {
		'print inside a loop': "program p\ninteger :: i\ndo i = 1, 3\nprint *, i\nend do\nend program\n",
		'print inside a loop, no declaration': "do i = 1, 3\nprint *, i\nend do\n",
		'write inside a loop': "program p\ninteger :: i\ndo i = 1, 3\nwrite (*, '(I0)') i\nend do\nend program\n",
		'print after a loop': "program p\ninteger :: i\ndo i = 1, 3\nend do\nprint *, 'after the loop'\nend program\n",
		'print before and after a loop': "program p\ninteger :: i\nprint *, 'before'\ndo i = 1, 3\nend do\nprint *, 'after'\nend program\n",
	};

	(async () => {
		const fortran = window.livecodes && window.livecodes.fortran;
		if (!fortran) {
			document.body.dataset.status = 'FAIL: runner did not define livecodes.fortran';
			return;
		}
		log(`runner defined livecodes.fortran after ${Date.now() - started} ms`);

		const tag = document.querySelector('script[type="text/fortran-wasm"]');
		const results = [];
		for (const [label, code] of Object.entries(CASES)) {
			tag.textContent = code;
			try {
				const result = await fortran.run();
				results.push({
					label,
					output: result.output,
					error: result.error,
					exitCode: result.exitCode,
				});
			} catch (error) {
				results.push({ label, threw: (error && error.message) || String(error) });
			}
		}
		log(`finished after ${Date.now() - started} ms`);
		document.body.dataset.status = JSON.stringify(results);
	})();
</script>
</body>
</html>
