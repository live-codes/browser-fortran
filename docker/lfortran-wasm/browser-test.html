<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LFortran wasm — browser run</title>
<style>
	body { font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; margin: 1rem; }
	#summary { font-size: 1.4rem; font-weight: 700; }
	#summary[data-state="pending"] { opacity: 0.5; }
	.case { margin-top: 0.75rem; }
	.ok { color: #0a0; }
	.fail { color: #c00; }
	.output { white-space: pre-wrap; margin-left: 1.5rem; color: #333; }
	.errors { white-space: pre-wrap; margin-left: 1.5rem; color: #960; }
</style>
</head>
<body>
<div id="summary" data-state="pending">loading the compiler…</div>
<div id="results"></div>

<script type="module">
	// Same loader and same corpus as test-run.mjs. Nothing here is browser-specific apart from the DOM.
	import { CASES, stdinFor } from './corpus.mjs';
	// The package's loader, not a copy of it. Serving the repository root rather than this directory is
	// what lets the page reach it.
	import { createCompiler } from '../../packages/lfortran-wasm/src/index.js';

	const summary = document.getElementById('summary');
	const results = document.getElementById('results');

	const row = (text, cls) => {
		const div = document.createElement('div');
		if (cls) div.className = cls;
		div.textContent = text;
		results.appendChild(div);
	};

	// Whatever happens, the page reports a verdict rather than hanging.
	const verdict = (text, cls, detail) => {
		summary.dataset.state = 'done';
		summary.className = cls;
		summary.textContent = text;
		document.body.dataset.status = detail;
	};

	try {
		const startedAt = performance.now();
		const compiler = await createCompiler({ baseUrl: new URL('./out/', import.meta.url) });
		const loadMs = Math.round(performance.now() - startedAt);

		const failures = [];
		let passed = 0;
		const entries = Object.entries(CASES);
		for (const [name, source] of entries) {
			const { stdout, errors, exitCode, runMs } = await compiler.run(source, stdinFor(name));

			const ok = exitCode === 0;
			if (ok) passed += 1;
			else failures.push(name);
			row(`${ok ? 'OK  ' : 'FAIL'}  ${name}  (${Math.round(runMs)} ms)`, ok ? 'ok' : 'fail');
			if (stdout.trim()) row(stdout.trimEnd(), 'output');
			if (!ok && errors) row(errors.trim().slice(0, 600), 'errors');
		}

		verdict(
			`${passed}/${entries.length} compiled and ran (compiler ready in ${loadMs} ms)`,
			failures.length ? 'fail' : 'ok',
			failures.length ? `failures: ${failures.join(', ')}` : 'all passed',
		);
		window.__lfortran = { passed, total: entries.length, failures, loadMs };
	} catch (error) {
		verdict(`FAILED: ${error?.message ?? error}`, 'fail', 'failed');
		row(error?.stack ?? String(error), 'errors');
		window.__lfortran = { failures: [String(error?.message ?? error)] };
	}
</script>
</body>
</html>
